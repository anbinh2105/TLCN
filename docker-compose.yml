services:

  # ==========================================================
  # MINIO - DATA LAKE STORAGE
  # ==========================================================
  minio:
    image: minio/minio:latest
    container_name: cantho-flood-minio

    ports:
      - "9000:9000"
      - "9001:9001"

    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin12345

    command: server /data --console-address ":9001"

    volumes:
      - minio_data:/data

    restart: unless-stopped


  # ==========================================================
  # POSTGRESQL - HIVE METASTORE DATABASE
  # ==========================================================
  postgres:
    image: postgres:16
    container_name: cantho-flood-postgres

    environment:
      POSTGRES_DB: metastore
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hivepassword

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U hive -d metastore"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped


  # ==========================================================
  # HIVE METASTORE
  # ==========================================================
  hive-metastore:
    build:
      context: ./docker/hive
      dockerfile: Dockerfile.hive3

    image: cantho-flood-hive:3.1.3
    container_name: cantho-flood-hive-metastore

    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      IS_RESUME: "true"

      SERVICE_OPTS: >-
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://postgres:5432/metastore_v3
        -Djavax.jdo.option.ConnectionUserName=hive
        -Djavax.jdo.option.ConnectionPassword=hivepassword

    ports:
      - "9083:9083"

    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

    restart: unless-stopped


# ============================================================
# PERSISTENT VOLUMES
# ============================================================
volumes:

  # Existing MinIO volume
  # DO NOT DELETE
  minio_data:

  # Hive Metastore PostgreSQL data
  postgres_data: