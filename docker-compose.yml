x-airflow-common: &airflow-common
  image: apache/airflow:3.1.5
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__API__SECRET_KEY: "tlcn-local-demo-secret-change-before-sharing"
    AIRFLOW__API_AUTH__JWT_SECRET: "tlcn-local-demo-jwt-change-before-sharing"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-apiserver:8080/execution/"
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
    - ./airflow/config:/opt/airflow/config
    - ./reports/quality:/opt/airflow/project-reports/quality:ro
  networks:
    - default
    - airflow_internal
  depends_on:
    airflow-postgres:
      condition: service_healthy
  restart: unless-stopped

services:

  # ==========================================================
  # MINIO - DATA LAKE STORAGE
  # ==========================================================
  minio:
    image: minio/minio:latest
    container_name: cantho-flood-minio

    ports:
      - "9000:9000"
      - "9001:9001"

    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin12345

    command: server /data --console-address ":9001"

    volumes:
      - minio_data:/data

    restart: unless-stopped


  # ==========================================================
  # POSTGRESQL - HIVE METASTORE DATABASE
  # ==========================================================
  postgres:
    image: postgres:16
    container_name: cantho-flood-postgres

    environment:
      POSTGRES_DB: metastore
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hivepassword

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U hive -d metastore"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped


  # ==========================================================
  # HIVE METASTORE
  # ==========================================================
  hive-metastore:
    build:
      context: ./docker/hive
      dockerfile: Dockerfile.hive3

    image: cantho-flood-hive:3.1.3
    container_name: cantho-flood-hive-metastore

    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      IS_RESUME: "true"

      SERVICE_OPTS: >-
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://postgres:5432/metastore_v3
        -Djavax.jdo.option.ConnectionUserName=hive
        -Djavax.jdo.option.ConnectionPassword=hivepassword

    ports:
      - "9083:9083"

    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

    restart: unless-stopped

  # ==========================================================
  # APACHE SUPERSET - DATA VISUALIZATION
  # ==========================================================
  superset:
    build:
      context: ./docker/superset
      dockerfile: Dockerfile

    ports:
      - "8088:8088"

    environment:
      SUPERSET_SECRET_KEY: "abcdefg"

    volumes:
      - superset_home:/app/superset_home

    command: >
      /bin/sh -c "
      superset db upgrade &&
      superset fab create-admin
      --username admin
      --firstname Admin
      --lastname User
      --email admin@example.com
      --password admin || true;
      superset init;
      /usr/bin/run-server.sh
      "

    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped

# kafka
  kafka:
      image: apache/kafka:4.1.2
      container_name: tlcn-kafka
      hostname: kafka
      restart: unless-stopped

      ports:
        - "127.0.0.1:9092:9092"

      environment:
        KAFKA_NODE_ID: "1"
        KAFKA_PROCESS_ROLES: "broker,controller"

        KAFKA_LISTENERS: >-
          INTERNAL://0.0.0.0:29092,
          EXTERNAL://0.0.0.0:9092,
          CONTROLLER://0.0.0.0:9093

        KAFKA_ADVERTISED_LISTENERS: >-
          INTERNAL://kafka:29092,
          EXTERNAL://127.0.0.1:9092

        KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >-
          INTERNAL:PLAINTEXT,
          EXTERNAL:PLAINTEXT,
          CONTROLLER:PLAINTEXT

        KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
        KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
        KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"

        KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
        KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
        KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
        KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"

        KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
        KAFKA_NUM_PARTITIONS: "3"

      volumes:
        - kafka_data:/var/lib/kafka/data

      networks:
        - default
        - kafka_net


  # ==========================================================
  # AIRFLOW METADATA DATABASE
  # ==========================================================
  airflow-postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - airflow_internal
    restart: unless-stopped


  # ==========================================================
  # AIRFLOW INITIALIZATION
  # ==========================================================
  airflow-init:
    <<: *airflow-common
    restart: "no"
    command: >
      bash -c "airflow db migrate"


  # ==========================================================
  # AIRFLOW API SERVER
  # ==========================================================
  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "127.0.0.1:8089:8080"
    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully


  # ==========================================================
  # AIRFLOW SCHEDULER
  # ==========================================================
  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully


  # ==========================================================
  # AIRFLOW DAG PROCESSOR
  # ==========================================================
  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  trino:
    image: trinodb/trino:476
    container_name: cantho-flood-trino

    ports:
      - "127.0.0.1:8080:8080"

    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY}

    volumes:
      - ./trino/etc:/etc/trino:ro
      - trino_data:/data/trino

    networks:
      - default

    restart: unless-stopped

# ============================================================
# PERSISTENT VOLUMES
# ============================================================
volumes:

  # Existing MinIO volume
  # DO NOT DELETE
  minio_data:
  superset_home:
  # Hive Metastore PostgreSQL data
  postgres_data:
  kafka_data:
  airflow_postgres_data:
  trino_data:


networks:
  default:
    name: tlcn_default

  kafka_net:
    name: kafka_kafka_net

  airflow_internal:
    driver: bridge
