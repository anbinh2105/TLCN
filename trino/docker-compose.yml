services:
  trino:
    image: trinodb/trino:476
    container_name: cantho-flood-trino

    ports:
      - "127.0.0.1:8080:8080"

    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY}

    volumes:
      - ./etc:/etc/trino:ro
      - trino_data:/data/trino

    networks:
      - tlcn_default

    restart: unless-stopped

volumes:
  trino_data:

networks:
  tlcn_default:
    external: true
    name: tlcn_default